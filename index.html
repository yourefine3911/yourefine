const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha:false });
const img = new Image();
img.src = IMAGE_DATA;

let W=0,H=0, particles=[], started=0, animationFrame=0;
const rand=(a,b)=>Math.random()*(b-a)+a;

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,1.5);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(img.complete && img.naturalWidth) buildParticles();
}
window.addEventListener("resize", resize);

function buildParticles(){
  const off=document.createElement("canvas");
  const octx=off.getContext("2d",{willReadFrequently:true});
  const scale=Math.min((W*.88)/img.naturalWidth,(H*.88)/img.naturalHeight);
  const iw=Math.max(1,Math.round(img.naturalWidth*scale));
  const ih=Math.max(1,Math.round(img.naturalHeight*scale));
  off.width=iw; off.height=ih;
  octx.drawImage(img,0,0,iw,ih);
  const data=octx.getImageData(0,0,iw,ih).data;
  const ox=(W-iw)/2, oy=(H-ih)/2;
  const pts=[];
  // Ambil piksel terang dari gambar; latar hitam tidak dijadikan partikel.
  const step=Math.max(1,Math.round(Math.max(iw,ih)/420));
  for(let y=0;y<ih;y+=step){
    for(let x=0;x<iw;x+=step){
      const i=(y*iw+x)*4, r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      const bright=(r+g+b)/3;
      if(a>80 && bright>24){
        pts.push({x:ox+x,y:oy+y,r,g,b});
      }
    }
  }
  // Batasi jumlah partikel agar tetap lancar di HP.
  const max=7000;
  if(pts.length>max){
    for(let i=pts.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [pts[i],pts[j]]=[pts[j],pts[i]];
    }
    pts.length=max;
  }
  particles=pts.map(p=>({
    tx:p.x,ty:p.y,x:rand(0,W),y:rand(0,H),
    vx:0,vy:0,
    color:`rgb(${p.r},${p.g},${p.b})`,
    size:rand(.35,.85), phase:rand(0,Math.PI*2),
    drift:rand(.15,.8)
  }));
  started=performance.now();
}

function draw(now){
  ctx.fillStyle="#030108";
  ctx.fillRect(0,0,W,H);
  // Foto tipis di belakang partikel agar siluet dan detail tetap mudah dikenali.
  if (img.complete && img.naturalWidth) {
    const scale=Math.min((W*.88)/img.naturalWidth,(H*.88)/img.naturalHeight);
    const iw=img.naturalWidth*scale, ih=img.naturalHeight*scale;
    ctx.save();
    ctx.globalAlpha=0.32;
    ctx.drawImage(img,(W-iw)/2,(H-ih)/2,iw,ih);
    ctx.restore();
  }
  const elapsed=(now-started)/1000;
  const progress=Math.min(1,elapsed/1.35);
  const ease=1-Math.pow(1-progress,3);

  for(const p of particles){
    const shimmer=Math.sin(now*.002+p.phase);
    const tx=p.tx + Math.sin(now*.0007+p.phase)*p.drift*2;
    const ty=p.ty + Math.cos(now*.0008+p.phase)*p.drift*2;
    p.x += (tx-p.x)*(.045+.14*ease);
    p.y += (ty-p.y)*(.045+.14*ease);

    const glow=.55+(.45*(shimmer+1)/2);
    ctx.globalAlpha=glow;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
  animationFrame=requestAnimationFrame(draw);
}

img.onload=()=>{
  resize();
  if(animationFrame) cancelAnimationFrame(animationFrame);
  animationFrame=requestAnimationFrame(draw);
};
canvas.addEventListener("pointerdown",()=>{
  for(const p of particles){p.x=rand(0,W);p.y=rand(0,H);}
  started=performance.now();
});
</script>
